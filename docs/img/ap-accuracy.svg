<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img"><title>How close BeaconFix puts an access point</title><desc>Median miss and reported 95 percent radius per scenario: One walk around the building: 10.5 m, 23.1 m; Two walks around it: 9.3 m, 20.0 m; A walk + samples 60–120 m up a hill: 15.5 m, 27.6 m; A walk + hours indoors: 10.0 m, 46.1 m; A 40–80 m street loop: 12.5 m, 27.1 m</desc><style>
  .bg{fill:none}
  .t{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
  .s{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#52514e}
  .l{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
  .v{font:600 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
  .g{stroke:#e4e3df;stroke-width:1}
  .ax{stroke:#a8a7a1;stroke-width:1}
  .c1{fill:#2a78d6}.c2{fill:#eb6834}.k1{stroke:#2a78d6}.k2{stroke:#eb6834}
  .box{fill:#f4f3f0;stroke:#d6d5d0;stroke-width:1}
  .hl{fill:#e8f0fb;stroke:#2a78d6;stroke-width:1.5}
  .ln{stroke:#8a8983;stroke-width:1.5;fill:none}
  .lnb{stroke:#2a78d6;stroke-width:2;fill:none}
  .arr{fill:#8a8983}
  @media (prefers-color-scheme: dark){
    .t,.l,.v{fill:#f0efec}.s{fill:#c3c2b7}
    .g{stroke:#34332f}.ax{stroke:#6c6b66}
    .c1{fill:#3987e5}.c2{fill:#d95926}.k1{stroke:#3987e5}.k2{stroke:#d95926}
    .box{fill:#22221f;stroke:#45443f}
    .hl{fill:#1b2a3d;stroke:#3987e5}
    .ln{stroke:#8f8e87}.lnb{stroke:#3987e5}.arr{fill:#8f8e87}
  }
</style><rect class="bg" width="760" height="344"/><text class="t" x="0" y="20">How close BeaconFix puts an access point</text><text class="s" x="0" y="40">Median over 300 simulated surveys per scenario, with walls, shadowing and GPS error (estimator 3)</text><rect class="c1" x="230" y="53" width="10" height="10" rx="2"/><text class="s" x="245" y="62">median miss</text><rect class="c2" x="330.4" y="53" width="10" height="10" rx="2"/><text class="s" x="345.4" y="62">95 % radius it reports</text><line class="g" x1="230.0" y1="70" x2="230.0" y2="310"/><text class="s" x="230.0" y="326" text-anchor="middle">0 m</text><line class="g" x1="322.0" y1="70" x2="322.0" y2="310"/><text class="s" x="322.0" y="326" text-anchor="middle">10 m</text><line class="g" x1="414.0" y1="70" x2="414.0" y2="310"/><text class="s" x="414.0" y="326" text-anchor="middle">20 m</text><line class="g" x1="506.0" y1="70" x2="506.0" y2="310"/><text class="s" x="506.0" y="326" text-anchor="middle">30 m</text><line class="g" x1="598.0" y1="70" x2="598.0" y2="310"/><text class="s" x="598.0" y="326" text-anchor="middle">40 m</text><line class="g" x1="690.0" y1="70" x2="690.0" y2="310"/><text class="s" x="690.0" y="326" text-anchor="middle">50 m</text><text class="l" x="218" y="93" text-anchor="end">One walk around the building</text><path class="c1" d="M230.0,77.0 h92.6 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-92.6 z"/><text class="v" x="332.6" y="88">10.5 m</text><path class="c2" d="M230.0,94.0 h208.5 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-208.5 z"/><text class="s" x="448.5" y="105">23.1 m</text><text class="l" x="218" y="139" text-anchor="end">Two walks around it</text><path class="c1" d="M230.0,123.0 h81.6 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-81.6 z"/><text class="v" x="321.6" y="134">9.3 m</text><path class="c2" d="M230.0,140.0 h180.0 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-180.0 z"/><text class="s" x="420.0" y="151">20 m</text><text class="l" x="218" y="185" text-anchor="end">A walk + samples 60–120 m up a hill</text><path class="c1" d="M230.0,169.0 h138.6 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-138.6 z"/><text class="v" x="378.6" y="180">15.5 m</text><path class="c2" d="M230.0,186.0 h249.9 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-249.9 z"/><text class="s" x="489.9" y="197">27.6 m</text><text class="l" x="218" y="231" text-anchor="end">A walk + hours indoors</text><path class="c1" d="M230.0,215.0 h88.0 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-88.0 z"/><text class="v" x="328.0" y="226">10 m</text><path class="c2" d="M230.0,232.0 h420.1 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-420.1 z"/><text class="s" x="660.1" y="243">46.1 m</text><text class="l" x="218" y="277" text-anchor="end">A 40–80 m street loop</text><path class="c1" d="M230.0,261.0 h111.0 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-111.0 z"/><text class="v" x="351.0" y="272">12.5 m</text><path class="c2" d="M230.0,278.0 h245.3 a4,4 0 0 1 4,4 v6.0 a4,4 0 0 1 -4,4 h-245.3 z"/><text class="s" x="485.3" y="289">27.1 m</text><line class="ax" x1="230" y1="70" x2="230" y2="310"/></svg>
