<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img"><title>How the BeaconFix pieces talk</title><desc>Nodes reach the phone over BLE and the desktop over UDP; the phone syncs with the desktop on the LAN; the desktop and the phone sync with the optional hub over BFS3; the Pi agent is a remote radio; Lite is the locator as a library.</desc><style>
  .bg{fill:none}
  .t{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
  .s{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#52514e}
  .l{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
  .v{font:600 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
  .g{stroke:#e4e3df;stroke-width:1}
  .ax{stroke:#a8a7a1;stroke-width:1}
  .c1{fill:#2a78d6}.c2{fill:#eb6834}.k1{stroke:#2a78d6}.k2{stroke:#eb6834}
  .box{fill:#f4f3f0;stroke:#d6d5d0;stroke-width:1}
  .hl{fill:#e8f0fb;stroke:#2a78d6;stroke-width:1.5}
  .ln{stroke:#8a8983;stroke-width:1.5;fill:none}
  .lnb{stroke:#2a78d6;stroke-width:2;fill:none}
  .arr{fill:#8a8983}
  @media (prefers-color-scheme: dark){
    .t,.l,.v{fill:#f0efec}.s{fill:#c3c2b7}
    .g{stroke:#34332f}.ax{stroke:#6c6b66}
    .c1{fill:#3987e5}.c2{fill:#d95926}.k1{stroke:#3987e5}.k2{stroke:#d95926}
    .box{fill:#22221f;stroke:#45443f}
    .hl{fill:#1b2a3d;stroke:#3987e5}
    .ln{stroke:#8f8e87}.lnb{stroke:#3987e5}.arr{fill:#8f8e87}
  }
</style><rect class="bg" width="760" height="360"/><text class="t" x="0" y="20">How the pieces talk</text><rect class="box" x="0" y="74" width="190" height="92" rx="8"/><text class="l" x="95.0" y="98" text-anchor="middle" font-weight="600">ESP32 / Heltec nodes</text><text class="s" x="95.0" y="118" text-anchor="middle">Wi-Fi monitor, BLE scanner</text><text class="s" x="95.0" y="134" text-anchor="middle">ESP-NOW + LoRa mesh</text><rect class="box" x="285" y="74" width="190" height="92" rx="8"/><text class="l" x="380.0" y="98" text-anchor="middle" font-weight="600">Android app</text><text class="s" x="380.0" y="118" text-anchor="middle">GPS, scans, ALPR camera</text><text class="s" x="380.0" y="134" text-anchor="middle">store-and-forward for nodes</text><rect class="hl" x="570" y="74" width="190" height="92" rx="8"/><text class="l" x="665.0" y="98" text-anchor="middle" font-weight="600">Desktop + tray</text><text class="s" x="665.0" y="118" text-anchor="middle">the locator, the map,</text><text class="s" x="665.0" y="134" text-anchor="middle">the encrypted database</text><rect class="box" x="285" y="240" width="190" height="92" rx="8"/><text class="l" x="380.0" y="264" text-anchor="middle" font-weight="600">Pi agent</text><text class="s" x="380.0" y="284" text-anchor="middle">a remote radio</text><text class="s" x="380.0" y="300" text-anchor="middle">for the desktop</text><rect class="box" x="570" y="240" width="190" height="92" rx="8"/><text class="l" x="665.0" y="264" text-anchor="middle" font-weight="600">Your hub (optional)</text><text class="s" x="665.0" y="284" text-anchor="middle">headless, self-hosted,</text><text class="s" x="665.0" y="300" text-anchor="middle">reachable over your VPN</text><rect class="box" x="0" y="240" width="190" height="92" rx="8" stroke-dasharray="5 4"/><text class="l" x="95.0" y="264" text-anchor="middle" font-weight="600">BeaconFix Lite</text><text class="s" x="95.0" y="284" text-anchor="middle">the locator as a library:</text><text class="s" x="95.0" y="300" text-anchor="middle">players, frames, sensors</text><path class="ln" d="M190,108 L278.0,108.0"/><path class="arr" d="M285,108 L277.0,104.0 L277.0,112.0 z"/><text class="s" x="237" y="100" text-anchor="middle">BLE</text><path class="ln" d="M285,134 L197.0,134.0"/><path class="arr" d="M190,134 L198.0,138.0 L198.0,130.0 z"/><text class="s" x="237" y="152" text-anchor="middle">GPS, time</text><path class="ln" d="M475,120 L563.0,120.0"/><path class="arr" d="M570,120 L562.0,116.0 L562.0,124.0 z"/><text class="s" x="522" y="112" text-anchor="middle">LAN sync</text><path class="ln" d="M95,74 L95,46 L665,46 L665.0,67.0"/><path class="arr" d="M665,74 L669.0,66.0 L661.0,66.0 z"/><text class="s" x="380" y="40" text-anchor="middle">nodes on Wi-Fi: UDP</text><path class="ln" d="M475,270 L520,270 L520,192 L620,192 L620.0,173.0"/><path class="arr" d="M620,166 L616.0,174.0 L624.0,174.0 z"/><text class="s" x="528" y="264" text-anchor="start">LAN</text><path class="ln" d="M700,166 L700.0,233.0"/><path class="arr" d="M700,240 L704.0,232.0 L696.0,232.0 z"/><text class="s" x="708" y="212" text-anchor="start">BFS3 sync</text><text class="s" x="95" y="348" text-anchor="middle">asks Apple / BeaconDB only for APs</text><text class="s" x="95" y="362" text-anchor="middle">it can't place itself</text></svg>
