# BeaconFix: the Wi-Fi RTT responder interface belongs to hostapd, not NetworkManager.
# Installed to /etc/NetworkManager/conf.d/90-beaconfix-rtt.conf by setup-rtt-responder.sh.
# A [device] section (instead of keyfile unmanaged-devices=) so it never overrides other
# unmanaged-devices settings.
[device-beaconfix-rtt]
match-device=interface-name:bfrtt0
managed=0
